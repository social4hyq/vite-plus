name: test-ohos

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ohos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-ohos
            os: ubuntu-latest

    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/clone

      - name: Install Node.JS
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - name: Install dependencies
        run: pnpm install

      - name: Update Cargo.lock for OHOS patches
        run: cargo update -p fspy -p fspy_seccomp_unotify -p fspy_preload_unix -p shared_memory 2>/dev/null; true

      - uses: oxc-project/setup-rust@68c3199c5339f965e6e163924c3c450773eba42b

      - name: Setup OpenHarmony SDK
        uses: Boshen/setup-ohos-sdk@edb865a89a712f1f15dbad932dfa9cfce849d95c

      - name: Configure OHOS linker
        run: |
          echo "${OHOS_SDK_NATIVE}/llvm/bin" >> $GITHUB_PATH
          cat > /tmp/aarch64-linux-ohos-clang <<'WRAPPER'
          #!/bin/sh
          exec ${OHOS_SDK_NATIVE}/llvm/bin/clang --target=aarch64-linux-ohos "$@"
          WRAPPER
          chmod +x /tmp/aarch64-linux-ohos-clang

      - uses: ./.github/actions/build-upstream
        with:
          target: ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER: /tmp/aarch64-linux-ohos-clang
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_RUSTFLAGS: -C link-arg=-fuse-ld=lld -C link-arg=-lm

      - name: Verify artifacts
        run: |
          ls -lh packages/cli/binding/*.node target/${{ matrix.target }}/release/vp
          file packages/cli/binding/*.node target/${{ matrix.target }}/release/vp

      - name: Deploy and fix package.json
        run: |
          pnpm --filter=vite-plus deploy --prod --legacy vite-plus-deploy
          cp target/${{ matrix.target }}/release/vp vite-plus-deploy/
          cp packages/cli/binding/vite-plus.openharmony-arm64.node vite-plus-deploy/binding/
          # Fix package.json: resolve catalog: refs, add ohos-signpost
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('vite-plus-deploy/package.json','utf8'));
          const ws = fs.readFileSync('pnpm-workspace.yaml','utf8');
          const cat = {};
          const re = /^  '?(@?[\w@\/-]+?)'?: (.*)$/gm;
          let m;
          while ((m = re.exec(ws))) cat[m[1]] = m[2].replace(/^=/, '');
          function resolve(deps) { if (!deps) return; for (const k of Object.keys(deps)) { if (deps[k] === 'catalog:' && cat[k]) deps[k] = cat[k]; } }
          resolve(pkg.dependencies); resolve(pkg.devDependencies);
          // Remove workspace:* deps (already bundled into dist/)
          function removeWorkspace(deps) { if (!deps) return; for (const k of Object.keys(deps)) { if (String(deps[k]).startsWith('workspace:')) delete deps[k]; } }
          removeWorkspace(pkg.dependencies); removeWorkspace(pkg.devDependencies);
          // Add back workspace deps that dist/ still imports from npm
          pkg.dependencies ||= {};
          pkg.dependencies['@voidzero-dev/vite-plus-core'] = pkg.version || '0.1.24';
          pkg.dependencies['@voidzero-dev/vite-plus-test'] = pkg.version || '0.1.24';
          // Add ohos-signpost postinstall + rolldown binding copy
          pkg.scripts ||= {};
          pkg.scripts.postinstall = 'node postinstall-ohos.mjs && ohos-signpost';
          pkg.devDependencies ||= {}; pkg.devDependencies['ohos-signpost'] = '^1.0.2';
          fs.writeFileSync('vite-plus-deploy/package.json', JSON.stringify(pkg, null, 2));
          console.log('package.json fixed');
          "
          # Remove broken pnpm symlinks in node_modules — will be reinstalled by npm install on device
          rm -rf vite-plus-deploy/node_modules
          rm -f vite-plus-deploy/pnpm-lock.yaml
          # Write postinstall script to copy rolldown ohos binding to vite-plus-core
          cat > vite-plus-deploy/postinstall-ohos.mjs << 'SCRIPT'
import { copyFileSync, existsSync } from 'node:fs';
import { join } from 'node:path';
const cwd = process.env.INIT_CWD || process.cwd();
const src = join(cwd, 'node_modules/@rolldown/binding-openharmony-arm64/rolldown-binding.openharmony-arm64.node');
const dst = join(cwd, 'node_modules/@voidzero-dev/vite-plus-core/dist/rolldown/shared/rolldown-binding.openharmony-arm64.node');
if (existsSync(src)) { copyFileSync(src, dst); console.log('Copied rolldown ohos binding'); }
SCRIPT

      - name: Package minimal bundle
        run: tar -czf vite-plus-ohos-aarch64.tar.gz -C vite-plus-deploy .

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: vite-plus-ohos-aarch64-runtime
          path: ./vite-plus-ohos-aarch64.tar.gz
