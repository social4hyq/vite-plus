name: test-ohos

on:
  workflow_dispatch:

jobs:
  build-ohos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-ohos
            os: ubuntu-latest

    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/clone

      - name: Install Node.JS
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - name: Install dependencies
        run: pnpm install

      - name: Update Cargo.lock for OHOS patches
        run: cargo update -p fspy -p fspy_seccomp_unotify -p fspy_preload_unix -p shared_memory 2>/dev/null; true

      - uses: oxc-project/setup-rust@68c3199c5339f965e6e163924c3c450773eba42b

      - name: Setup OpenHarmony SDK
        uses: Boshen/setup-ohos-sdk@edb865a89a712f1f15dbad932dfa9cfce849d95c

      - name: Configure OHOS linker
        run: |
          echo "${OHOS_SDK_NATIVE}/llvm/bin" >> $GITHUB_PATH
          cat > /tmp/aarch64-linux-ohos-clang <<'WRAPPER'
          #!/bin/sh
          exec ${OHOS_SDK_NATIVE}/llvm/bin/clang --target=aarch64-linux-ohos "$@"
          WRAPPER
          chmod +x /tmp/aarch64-linux-ohos-clang

      - uses: ./.github/actions/build-upstream
        with:
          target: ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER: /tmp/aarch64-linux-ohos-clang
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_RUSTFLAGS: -C link-arg=-fuse-ld=lld -C link-arg=-lm

      - name: Verify artifacts
        run: |
          ls -lh packages/cli/binding/*.node target/${{ matrix.target }}/release/vp
          file packages/cli/binding/*.node target/${{ matrix.target }}/release/vp

      - name: Upload Napi binding
        uses: actions/upload-artifact@v4
        with:
          name: vite-plus-binding-${{ matrix.target }}
          path: ./packages/cli/binding/*.node

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: vite-plus-cli-${{ matrix.target }}
          path: ./target/${{ matrix.target }}/release/vp

      - name: Deploy vite-plus npm package
        run: pnpm --filter=vite-plus deploy --prod --legacy vite-plus-deploy

      - name: Fix package.json and add ohos-signpost
        run: |
          cp target/${{ matrix.target }}/release/vp vite-plus-deploy/
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('vite-plus-deploy/package.json','utf8'));
          // Resolve catalog: refs from workspace pnpm-workspace.yaml
          const ws = fs.readFileSync('pnpm-workspace.yaml','utf8');
          const cat = {};
          const re = /^  '?(@?[\w@\/-]+?)'?: (.*)$/gm;
          let m;
          while ((m = re.exec(ws))) cat[m[1]] = m[2].replace(/^=/, '');
          function resolve(deps) { if (!deps) return; for (const k of Object.keys(deps)) { if (deps[k] === 'catalog:' && cat[k]) deps[k] = cat[k]; } }
          resolve(pkg.dependencies); resolve(pkg.devDependencies);
          // Remove workspace:* deps (already bundled into dist/)
          function removeWorkspace(deps) { if (!deps) return; for (const k of Object.keys(deps)) { if (deps[k] === 'workspace:*') delete deps[k]; } }
          removeWorkspace(pkg.dependencies); removeWorkspace(pkg.devDependencies);
          // Add ohos-signpost postinstall
          pkg.scripts ||= {}; pkg.scripts.postinstall = 'ohos-signpost';
          pkg.devDependencies ||= {}; pkg.devDependencies['ohos-signpost'] = '^1.0.2';
          fs.writeFileSync('vite-plus-deploy/package.json', JSON.stringify(pkg, null, 2));
          const remaining = Object.entries({...pkg.dependencies, ...pkg.devDependencies}).filter(([,v]) => v === 'catalog:' || v === 'workspace:*');
          if (remaining.length) { console.error('Unresolved catalog:', remaining); process.exit(1); }
          console.log('All catalog: refs resolved, ohos-signpost added');
          "

      - name: Install deps and inject ohos bindings
        run: |
          cd vite-plus-deploy
          # npm on x64 CI won't pick openharmony-arm64 optional deps, install them explicitly
          npm install --ignore-scripts @oxfmt/binding-openharmony-arm64 @rolldown/binding-openharmony-arm64 2>&1 | tail -3
          # Then install everything else (linux-x64 bindings etc.)
          npm install 2>&1 | tail -5
          # Copy ohos bindings into the dist dirs where the JS loaders expect them
          cp node_modules/@oxfmt/binding-openharmony-arm64/oxfmt.openharmony-arm64.node node_modules/oxfmt/dist/
          cp node_modules/@rolldown/binding-openharmony-arm64/rolldown-binding.openharmony-arm64.node node_modules/@voidzero-dev/vite-plus-core/dist/rolldown/shared/
          cd ..

      - name: Verify ohos bindings present
        run: |
          echo "=== vite-plus binding ===" && ls -lh vite-plus-deploy/binding/*.node
          echo "=== rolldown ohos ===" && find vite-plus-deploy -name '*rolldown*openharmony*.node' -exec ls -lh {} \;
          echo "=== oxfmt ohos ===" && find vite-plus-deploy -name '*oxfmt*openharmony*.node' -exec ls -lh {} \;
          echo "=== oxlint ===" && find vite-plus-deploy -name '*oxlint*' -path '*/bin/*' -exec ls -lh {} \;

      - name: Package runtime bundle
        run: |
          tar -czf vite-plus-ohos-aarch64.tar.gz -C vite-plus-deploy .

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: vite-plus-ohos-aarch64-runtime
          path: ./vite-plus-ohos-aarch64.tar.gz

      - name: Test vp commands
        run: |
          mkdir -p /tmp/vp-test && tar -xzf vite-plus-ohos-aarch64.tar.gz -C /tmp/vp-test
          cd /tmp/vp-test
          echo "=== vp --version ===" && ./vp --version 2>&1 | head -3
          echo "=== vp fmt (check) ===" && ./vp fmt --check 2>&1 | head -5
